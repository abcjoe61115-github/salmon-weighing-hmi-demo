<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>歷史資料｜鮭魚秤重 HMI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#182634;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}header{background:#152c3c;border-bottom:5px solid #ef9b42;color:white;padding:18px max(20px,calc((100vw - 1280px)/2))}h1{font-size:28px;margin:0 0 5px}header p{margin:0;color:#b8c8d2;font-size:14px}.wrap{max-width:1280px;margin:20px auto;padding:0 20px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav a{background:white;border:1px solid #bdcbd3;border-radius:4px;color:#245164;min-width:145px;padding:13px 20px;text-align:center;text-decoration:none;font-size:17px;font-weight:bold}.nav a.active{background:#245f80;border-color:#245f80;color:white}.card{background:white;border:1px solid #bdcbd3;border-radius:6px;box-shadow:0 2px 3px #132d3c12;padding:24px;margin-bottom:16px}h2{font-size:22px;border-left:6px solid #ef9b42;padding-left:12px;margin:0 0 20px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:bold;color:#283e4a}input,select{height:54px;border:2px solid #b7c8d1;border-radius:4px;background:white;font:inherit;font-size:17px;padding:8px 12px;color:#182634}input:focus,select:focus{outline:2px solid #79b7d2}.btn{min-height:54px;border:0;border-radius:5px;padding:10px 22px;font:inherit;font-size:18px;font-weight:bold;cursor:pointer}.search{background:#245f80;color:white}.subtotal{background:#148454;color:white}.btn:hover{filter:brightness(.92)}.filter-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.hint{font-size:13px;color:#617783;margin:12px 0 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#dce6eb;text-align:left;color:#315365;font-size:15px;padding:14px 12px;white-space:nowrap}td{border-bottom:1px solid #e1e9ed;padding:14px 12px;font-size:16px}tbody tr:hover{background:#f3f8fa}.num{text-align:right;font-family:Consolas,monospace;font-weight:bold}.empty{text-align:center;color:#6b7e88;padding:30px}.summary{background:#101f28;border:3px solid #3d6273;border-radius:6px;color:#a9c0ca;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 30px}.summary span{font-size:18px}.summary strong{font-family:Consolas,monospace;color:#88edb5;font-size:clamp(32px,5vw,60px);font-variant-numeric:tabular-nums}.result{display:none}.result.show{display:block}.label{width:min(100%,600px);background:#fff;border:2px solid #202020;padding:16px;color:#111;font-family:'Microsoft JhengHei',sans-serif}.label-title{font-size:clamp(21px,3vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.label-middle{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:10px 0}.label-weight{font-family:Arial,sans-serif;font-size:clamp(42px,7vw,70px);white-space:nowrap;line-height:1.1}.label-weight small{font-size:16px}.label-meta{font-size:16px;white-space:nowrap}.bars{height:78px;width:100%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 7px,#111 7px 11px,#fff 11px 14px,#111 14px 16px,#fff 16px 18px);margin-top:10px}.barcode-text{text-align:center;font:18px Consolas,monospace;letter-spacing:1px}.note{color:#617783;font-size:13px;line-height:1.6}.result-row{display:flex;gap:24px;align-items:start;flex-wrap:wrap}.result-info{max-width:350px}.result-info strong{font-size:20px}.result-info p{line-height:1.65}.total-foot{margin-top:16px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.filters{grid-template-columns:1fr}.card{padding:16px}.filter-actions .btn{flex:1}.summary{padding:18px;display:block}.summary strong{display:block}.label-middle{display:block}.label-meta{margin-top:8px}}
</style>
</head>
<body><header><h1>歷史資料｜鮭魚秤重 HMI</h1><p>秤重紀錄查詢與小計標籤預覽 · DEMO</p></header>
<main class="wrap">
<nav class="nav"><a href="index.html">現場操作</a><a href="weighing-admin.html">主管管理</a><a class="active" href="history.html">歷史資料</a></nav>
<section class="card"><h2>篩選歷史紀錄</h2><div class="filters"><label class="field">開始日期<input id="dateFrom" type="date"></label><label class="field">結束日期<input id="dateTo" type="date"></label><label class="field">工單號<input id="orderFilter" placeholder="輸入完整或部分工單號"></label><label class="field">成品<select id="productFilter"><option value="">全部成品</option></select></label></div><div class="filter-actions"><button class="btn search" id="searchBtn">搜尋</button><button class="btn subtotal" id="subtotalBtn">小計標籤</button></div><p class="hint">小計會合計目前搜尋結果；若結果包含不同工單，請先篩選單一工單再產生標籤。</p></section>
<section class="card"><h2>歷史紀錄 <span id="count" class="note"></span></h2><div class="table-wrap"><table><thead><tr><th>日期時間</th><th>工單號</th><th>品號／成品</th><th>原物料</th><th>批號</th><th class="num">重量 (kg)</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card result" id="result"><h2>小計標籤預覽</h2><div class="result-row"><div class="label" aria-label="小計標籤"><div class="label-title" id="labelTitle"></div><div class="label-middle"><div class="label-weight"><small>小計：</small><span id="labelWeight"></span> KG</div><div class="label-meta">工單：<span id="labelOrder"></span><br>批號：<span id="labelLot"></span></div></div><div class="bars" aria-hidden="true"></div><div class="barcode-text" id="labelBarcode"></div></div><div class="result-info"><strong id="subtotalCount"></strong><p id="subtotalInfo"></p><p class="note">條碼圖樣目前僅供版面展示；下方數字依「工單號＋重量每 10 克的單位數」產生，例如 223.55 kg → 22355。</p></div></div></section>
<section class="summary total-foot"><span id="totalCaption">歷史紀錄總重</span><strong id="totalWeight">0.00 KG</strong></section>
</main>
<script>
const records=[
{at:'2026-11-10 08:12',order:'1111111111',code:'100001',product:'鮭魚清肉二分切',material:'大西洋鮭魚',lot:'20260713',weight:112.05},
{at:'2026-11-10 08:46',order:'1111111111',code:'100001',product:'鮭魚清肉二分切',material:'大西洋鮭魚',lot:'20260713',weight:111.50},
{at:'2026-11-10 09:15',order:'10040022',code:'100003',product:'鮭魚清肉',material:'大西洋鮭魚',lot:'20261110',weight:19.07},
{at:'2026-11-10 09:38',order:'10040022',code:'100003',product:'鮭魚清肉',material:'大西洋鮭魚',lot:'20261110',weight:18.42},
{at:'2026-11-09 10:05',order:'10040023',code:'100004',product:'鮭魚菲力',material:'大西洋鮭魚',lot:'20261109',weight:24.60},
{at:'2026-11-09 10:41',order:'10040023',code:'100004',product:'鮭魚菲力',material:'大西洋鮭魚',lot:'20261109',weight:22.35},
{at:'2026-11-08 11:18',order:'10040024',code:'100005',product:'鮭魚切片',material:'銀鮭',lot:'20261108',weight:15.25},
{at:'2026-11-08 11:47',order:'10040024',code:'100005',product:'鮭魚切片',material:'銀鮭',lot:'20261108',weight:16.80},
{at:'2026-11-07 13:02',order:'10040025',code:'100006',product:'鮭魚腹肉',material:'紅鮭',lot:'20261107',weight:12.40},
{at:'2026-11-07 13:26',order:'10040025',code:'100006',product:'鮭魚腹肉',material:'紅鮭',lot:'20261107',weight:13.15},
{at:'2026-11-06 14:10',order:'10040026',code:'100007',product:'鮭魚魚排',material:'大西洋鮭魚',lot:'20261106',weight:27.30},
{at:'2026-11-06 14:44',order:'10040026',code:'100007',product:'鮭魚魚排',material:'大西洋鮭魚',lot:'20261106',weight:26.90}
];
const $=id=>document.getElementById(id);let shown=records.slice();
for(const name of [...new Set(records.map(r=>r.product))]){const o=document.createElement('option');o.value=name;o.textContent=name;$('productFilter').append(o)}
function render(){const body=$('rows');body.replaceChildren();if(!shown.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='沒有符合條件的歷史紀錄';tr.append(td);body.append(tr)}for(const r of shown){const tr=document.createElement('tr');for(const value of [r.at,r.order,`${r.code}｜${r.product}`,r.material,r.lot,r.weight.toFixed(2)]){const td=document.createElement('td');td.textContent=value;if(value===r.weight.toFixed(2))td.className='num';tr.append(td)}body.append(tr)}$('count').textContent=`共 ${shown.length} 筆`;$('totalWeight').textContent=(shown.reduce((sum,r)=>sum+Math.round(r.weight*100),0)/100).toFixed(2)+' KG';$('totalCaption').textContent=`目前搜尋結果總重（${shown.length} 筆）`;$('result').classList.remove('show')}
$('searchBtn').onclick=()=>{const from=$('dateFrom').value,to=$('dateTo').value,order=$('orderFilter').value.trim(),product=$('productFilter').value;if(from&&to&&from>to){alert('開始日期不可晚於結束日期');return}shown=records.filter(r=>(!from||r.at.slice(0,10)>=from)&&(!to||r.at.slice(0,10)<=to)&&(!order||r.order.includes(order))&&(!product||r.product===product));render()};
$('subtotalBtn').onclick=()=>{if(!shown.length){alert('目前沒有可小計的紀錄');return}const orders=[...new Set(shown.map(r=>r.order))];if(orders.length!==1){alert('請先用工單號篩選至單一工單，再產生小計標籤');$('orderFilter').focus();return}const first=shown[0],grams10=shown.reduce((sum,r)=>sum+Math.round(r.weight*100),0),weight=(grams10/100).toFixed(2);$('labelTitle').textContent=`${first.code} ${first.product}`;$('labelWeight').textContent=weight;$('labelOrder').textContent=first.order;$('labelLot').textContent=[...new Set(shown.map(r=>r.lot))].join('、');$('labelBarcode').textContent=first.order+String(grams10);$('subtotalCount').textContent=`${shown.length} 筆紀錄小計`;$('subtotalInfo').textContent=`總重量 ${weight} kg；條碼數字：${first.order} + ${grams10} = ${first.order+String(grams10)}`;$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'start'})};
render();
</script></body></html>
